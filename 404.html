<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Nexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon/nexusFavicon.ico" type="image/x-icon">
    <style>
        /* ===== Página 404 - segue os tokens definidos em style.css ===== */
        html, body {
            height: 100%;
        }

        .error-page {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background:
                radial-gradient(ellipse 55% 60% at 12% 10%, var(--border-secondary), transparent 60%),
                radial-gradient(ellipse 50% 55% at 92% 90%, var(--shadow-primary), transparent 60%),
                linear-gradient(135deg, var(--color-blue-soft) 0%, var(--color-surface) 100%);
            overflow: hidden;
            isolation: isolate;
        }

        .error-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--grid-light) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-light) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: radial-gradient(ellipse 80% 65% at 50% 30%, black, transparent 75%);
            pointer-events: none;
            z-index: 0;
        }

        .error-page .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1.25rem;
        }

        .error-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
        }

        .error-logo .logo-icon {
            width: 2.2rem;
            height: 2.2rem;
            font-size: 1.1rem;
        }

        .error-logo .logo-text {
            font-size: 1.3rem;
        }

        .error-code {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: clamp(5.5rem, 16vw, 9rem);
            line-height: 1;
            background: var(--gradient-heading);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.02em;
        }

        .error-panel {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 1.1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-pill);
            background: var(--color-white);
            box-shadow: var(--shadow-card);
            font-family: var(--font-display);
            font-size: 0.78rem;
            color: var(--color-muted);
        }

        .error-panel .rec-dot {
            width: 8px;
            height: 8px;
            border-radius: var(--radius-circle);
            background: #ef4444;
            flex-shrink: 0;
        }

        .error-title {
            font-size: clamp(1.5rem, 3vw, 2rem);
            color: var(--color-text);
        }

        .error-text {
            max-width: 32rem;
            color: var(--color-muted);
            font-size: 1.02rem;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <section class="error-page">
        <div class="container">
            <a href="index.html" class="error-logo">
                <div class="logo-icon">N</div>
                <span class="logo-text">Nexus</span>
            </a>
            <span class="error-panel"><span class="rec-dot"></span>ERRO 404 · PÁGINA NÃO ENCONTRADA</span>
            <div class="error-code">404</div>
            <h1 class="error-title">Essa rota não foi conectada ao Nexus</h1>
            <p class="error-text">
                A página que você tentou acessar não existe, foi movida ou o endereço foi digitado incorretamente.
            </p>
            <div class="error-actions">
                <a href="index.html"><button class="btn btn-primary">Voltar ao Início →</button></a>
                <a href="tccs.html"><button class="btn btn-outline">Ver TCCs</button></a>
            </div>
        </div>
    </section>
</body>
</html>
